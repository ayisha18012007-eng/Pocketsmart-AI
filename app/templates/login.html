{% extends "base.html" %}

{% block title %}
Login - PocketSmart AI
{% endblock %}


{% block content %}

<section class="form-wrapper">

    <div class="form-card">

        <div class="text-center">

            <h1>
                Login
            </h1>

            <p class="page-subtitle">
                Login to access your PocketSmart AI
                recommendations.
            </p>

        </div>


        <div
            id="formMessage"
            class="hidden">
        </div>


        <form id="loginForm">

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    id="email"
                    class="form-control"
                    type="email"
                    required
                    placeholder="Enter your email">

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    id="password"
                    class="form-control"
                    type="password"
                    required
                    placeholder="Enter your password">

            </div>


            <button
                class="btn btn-primary"
                type="submit">

                Login

            </button>

        </form>


        <p style="margin-top: 20px;">

            Don't have an account?

            <a
                href="/register"
                style="color: var(--primary);">

                Register

            </a>

        </p>

    </div>

</section>

{% endblock %}
