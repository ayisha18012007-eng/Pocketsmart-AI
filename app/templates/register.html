{% extends "base.html" %}

{% block title %}
Register - PocketSmart AI
{% endblock %}


{% block content %}

<section class="form-wrapper">

    <div class="form-card">

        <div class="text-center">

            <h1>
                Create Account
            </h1>

            <p class="page-subtitle">
                Create your PocketSmart AI account.
            </p>

        </div>


        <div
            id="formMessage"
            class="hidden">
        </div>


        <form id="registerForm">

            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    id="username"
                    class="form-control"
                    type="text"
                    minlength="3"
                    maxlength="50"
                    required
                    placeholder="Enter username">

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    id="email"
                    class="form-control"
                    type="email"
                    required
                    placeholder="Enter email">

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    id="password"
                    class="form-control"
                    type="password"
                    minlength="6"
                    required
                    placeholder="At least 6 characters">

            </div>


            <button
                class="btn btn-primary"
                type="submit">

                Create Account

            </button>

        </form>


        <p style="margin-top: 20px;">

            Already have an account?

            <a
                href="/login"
                style="color: var(--primary);">

                Login

            </a>

        </p>

    </div>

</section>

{% endblock %}
